services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ricozedu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ricozedu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_MIGRATE_URL: postgres://ricoz_migrator:ricoz_migrator_dev@postgres:5432/ricozedu
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm --filter @ricozedu/api migrate"
    restart: "no"

  api:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://ricoz_app:ricoz_app_dev@postgres:5432/ricozedu
      DATABASE_MIGRATE_URL: postgres://ricoz_migrator:ricoz_migrator_dev@postgres:5432/ricozedu
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm --filter @ricozedu/api dev"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install && pnpm --filter @ricozedu/web dev"

volumes:
  pgdata:
